<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PromptOps</title>
<style>
  :root {
    --paper: #f7f7f5;
    --panel: #ffffff;
    --line: #dcdcd6;
    --ink: #1a1b1e;
    --muted: #6b6d76;
    --dim: #a8aab2;
    --accent: #2451b8;
    --ok: #1f7a4d;
    --err: #b23a2e;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
    --sans: -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    max-width: 1100px;
    margin: 0 auto;
    padding: 56px 32px 80px;
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: 48px;
    align-items: start;
  }

  .sidebar { position: sticky; top: 56px; }

  h1 {
    font-family: var(--mono);
    font-size: 1.4rem;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin: 0 0 10px;
  }
  h1::before { content: "> "; color: var(--accent); }
  .subtitle { color: var(--muted); font-size: 0.88rem; line-height: 1.5; margin: 0 0 32px; }

  .section-label {
    font-family: var(--mono);
    font-size: 0.7rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 12px;
  }

  .status-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--mono);
    font-size: 0.8rem;
    color: var(--muted);
    margin-top: 32px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
  }
  .status-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--dim);
    flex-shrink: 0;
  }
  .status-dot.up { background: var(--ok); }
  .status-dot.down { background: var(--err); }
  @media (prefers-reduced-motion: no-preference) {
    .status-dot.checking { animation: pulse 1.2s ease-in-out infinite; }
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

  label {
    display: block;
    font-family: var(--mono);
    font-size: 0.76rem;
    color: var(--muted);
    margin: 12px 0 5px;
  }
  label:first-of-type { margin-top: 0; }
  input, textarea {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 9px 11px;
    font-family: var(--sans);
    font-size: 0.9rem;
  }
  textarea { min-height: 60px; resize: vertical; font-family: var(--mono); font-size: 0.82rem; }
  input:focus, textarea:focus { outline: none; border-color: var(--accent); }

  button {
    margin-top: 14px;
    background: var(--ink);
    color: var(--paper);
    border: none;
    font-family: var(--mono);
    font-size: 0.8rem;
    letter-spacing: 0.03em;
    padding: 9px 18px;
    cursor: pointer;
  }
  button:hover { background: var(--accent); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }

  .main {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
  }
  .panel {
    border: 1px solid var(--line);
    padding: 20px;
    background: var(--panel);
    display: flex;
    flex-direction: column;
  }

  .readout {
    margin-top: 16px;
    border: 1px solid var(--line);
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .readout-head {
    font-family: var(--mono);
    font-size: 0.7rem;
    padding: 8px 12px;
    border-bottom: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    color: var(--dim);
  }
  .readout.ok .readout-head { color: var(--ok); }
  .readout.error .readout-head { color: var(--err); }
  .readout-idle {
    flex: 1;
    display: flex;
    align-items: center;
    padding: 12px;
    font-family: var(--mono);
    font-size: 0.8rem;
    color: var(--dim);
  }
  .row {
    display: grid;
    grid-template-columns: 100px 1fr;
    padding: 8px 12px;
    font-size: 0.85rem;
    border-bottom: 1px solid #eee;
  }
  .row:last-child { border-bottom: none; }
  .row dt { font-family: var(--mono); font-size: 0.72rem; color: var(--muted); }
  .row dd { margin: 0; word-break: break-word; }

  @media (max-width: 860px) {
    body { grid-template-columns: 1fr; padding: 32px 20px 60px; }
    .sidebar { position: static; }
    .main { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="sidebar">
  <h1>PromptOps</h1>
  <p class="subtitle">
    Prompt-optimization API with caching, retries, circuit breakers, and
    statistical A/B testing. This is a live demo.
  </p>

  <div class="section-label">Authentication</div>
  <label for="api-key-input">API Key</label>
  <input id="api-key-input" type="password" placeholder="Paste your API key">

  <div class="status-row">
    <span id="status-dot" class="status-dot checking"></span>
    <span id="status-text">checking api...</span>
  </div>
</div>

<div class="main">

  <div class="panel">
    <div class="section-label">/optimize</div>
    <form id="optimize-form">
      <label for="prompt-input">Prompt</label>
      <textarea id="prompt-input" required></textarea>
      <label for="goal-input">Goal</label>
      <input id="goal-input" type="text" required>
      <button type="submit">Run</button>
    </form>
    <div id="optimize-result" class="readout">
      <div class="readout-idle">awaiting request&hellip;</div>
    </div>
  </div>

  <div class="panel">
    <div class="section-label">/compare</div>
    <form id="compare-form">
      <label for="cmp-prompt-input">Prompt</label>
      <textarea id="cmp-prompt-input" required></textarea>
      <label for="cmp-goal-input">Goal</label>
      <input id="cmp-goal-input" type="text" required>
      <label for="candidate-a-input">Candidate A</label>
      <textarea id="candidate-a-input" required></textarea>
      <label for="candidate-b-input">Candidate B</label>
      <textarea id="candidate-b-input" required></textarea>
      <button type="submit">Run</button>
    </form>
    <div id="compare-result" class="readout">
      <div class="readout-idle">awaiting request&hellip;</div>
    </div>
  </div>

</div>

<script>
  const API_BASE = "https://promptops-api.onrender.com";

  fetch(API_BASE + "/health")
    .then(r => {
      const dot = document.getElementById("status-dot");
      const text = document.getElementById("status-text");
      dot.classList.remove("checking");
      if (r.ok) {
        dot.classList.add("up");
        text.textContent = "api online";
      } else {
        dot.classList.add("down");
        text.textContent = "api unreachable";
      }
    })
    .catch(() => {
      const dot = document.getElementById("status-dot");
      dot.classList.remove("checking");
      dot.classList.add("down");
      document.getElementById("status-text").textContent = "api unreachable";
    });

  function getApiKey() {
    return document.getElementById("api-key-input").value;
  }

  async function callApi(path, body) {
    const response = await fetch(API_BASE + path, {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-API-Key": getApiKey() },
      body: JSON.stringify(body)
    });
    const requestId = response.headers.get("X-Request-ID") || "n/a";
    const data = await response.json();
    return { ok: response.ok, status: response.status, requestId, data };
  }

  function renderReadout(div, outcome, rows) {
    div.classList.remove("ok", "error");
    div.classList.add(outcome.ok ? "ok" : "error");
    const head = `<div class="readout-head"><span>${outcome.status} ${outcome.ok ? "OK" : "ERROR"}</span><span>${outcome.requestId}</span></div>`;
    const body = outcome.ok
      ? rows.map(([k, v]) => `<div class="row"><dt>${k}</dt><dd>${v}</dd></div>`).join("")
      : `<div class="row"><dt>detail</dt><dd>${outcome.data.detail || "Unknown error"}</dd></div>`;
    div.innerHTML = head + body;
  }

  document.getElementById("optimize-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const button = event.target.querySelector("button");
    const resultDiv = document.getElementById("optimize-result");
    button.disabled = true;

    const outcome = await callApi("/optimize", {
      prompt: document.getElementById("prompt-input").value,
      goal: document.getElementById("goal-input").value
    });

    renderReadout(resultDiv, outcome, [
      ["optimized_prompt", outcome.data.optimized_prompt],
      ["changes", outcome.data.changes]
    ]);
    button.disabled = false;
  });

  document.getElementById("compare-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const button = event.target.querySelector("button");
    const resultDiv = document.getElementById("compare-result");
    button.disabled = true;

    const outcome = await callApi("/compare", {
      prompt: document.getElementById("cmp-prompt-input").value,
      goal: document.getElementById("cmp-goal-input").value,
      candidate_a: document.getElementById("candidate-a-input").value,
      candidate_b: document.getElementById("candidate-b-input").value
    });

    renderReadout(resultDiv, outcome, [
      ["winner", "candidate " + outcome.data.winner],
      ["score_a", outcome.data.score_a],
      ["score_b", outcome.data.score_b],
      ["reasoning", outcome.data.reasoning]
    ]);
    button.disabled = false;
  });
</script>
</body>
</html>
