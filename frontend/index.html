<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PromptOps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f7f7f5;
    --panel: #ffffff;
    --line: #dcdcd6;
    --ink: #1a1b1e;
    --muted: #6b6d76;
    --dim: #a8aab2;
    --accent: #2451b8;
    --ok: #1f7a4d;
    --err: #b23a2e;
    --mono: "JetBrains Mono", monospace;
    --sans: "Inter", -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    max-width: 720px;
    margin: 0 auto;
    padding: 56px 24px 80px;
  }

  header { border-bottom: 1px solid var(--line); padding-bottom: 24px; margin-bottom: 28px; }
  h1 {
    font-family: var(--mono);
    font-size: 1.4rem;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin: 0 0 10px;
  }
  h1::before { content: "> "; color: var(--accent); }
  .subtitle { color: var(--muted); font-size: 0.9rem; line-height: 1.55; margin: 0; }

  .status-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--mono);
    font-size: 0.78rem;
    color: var(--muted);
    margin-top: 16px;
  }
  .status-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--dim);
    flex-shrink: 0;
  }
  .status-dot.up { background: var(--ok); }
  .status-dot.down { background: var(--err); }
  @media (prefers-reduced-motion: no-preference) {
    .status-dot.checking { animation: pulse 1.2s ease-in-out infinite; }
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

  .section {
    border: 1px solid var(--line);
    background: var(--panel);
    padding: 22px;
    margin-bottom: 24px;
  }
  .section-label {
    font-family: var(--mono);
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 14px;
  }

  label {
    display: block;
    font-family: var(--mono);
    font-size: 0.76rem;
    color: var(--muted);
    margin: 14px 0 5px;
  }
  label:first-of-type { margin-top: 0; }
  input, textarea {
    width: 100%;
    background: var(--paper);
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 10px 12px;
    font-family: var(--sans);
    font-size: 0.92rem;
  }
  textarea { min-height: 110px; resize: vertical; line-height: 1.5; }
  input:focus, textarea:focus { outline: none; border-color: var(--accent); }

  button {
    margin-top: 16px;
    background: var(--ink);
    color: var(--paper);
    border: none;
    font-family: var(--mono);
    font-weight: 500;
    font-size: 0.82rem;
    letter-spacing: 0.03em;
    padding: 10px 20px;
    cursor: pointer;
  }
  button:hover { background: var(--accent); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }

  .readout {
    margin-top: 18px;
    border: 1px solid var(--line);
    display: none;
  }
  .readout.visible { display: block; }
  .readout-head {
    font-family: var(--mono);
    font-size: 0.72rem;
    padding: 9px 12px;
    border-bottom: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    color: var(--dim);
  }
  .readout.pending .readout-head { color: var(--muted); }
  .readout.ok .readout-head { color: var(--ok); }
  .readout.error .readout-head { color: var(--err); }
  .row {
    display: grid;
    grid-template-columns: 110px 1fr;
    padding: 10px 12px;
    font-size: 0.9rem;
    line-height: 1.5;
    border-bottom: 1px solid #eee;
  }
  .row:last-child { border-bottom: none; }
  .row dt { font-family: var(--mono); font-size: 0.72rem; color: var(--muted); }
  .row dd { margin: 0; word-break: break-word; }
</style>
</head>
<body>

<header>
  <h1>PromptOps</h1>
  <p class="subtitle">
    Prompt-optimization API with caching, retries, circuit breakers, and
    statistical A/B testing. This is a live demo.
  </p>
  <div class="status-row">
    <span id="status-dot" class="status-dot checking"></span>
    <span id="status-text">checking api...</span>
  </div>
</header>

<div class="section">
  <label for="api-key-input">API Key</label>
  <input id="api-key-input" type="password" placeholder="Paste your API key">
</div>

<div class="section">
  <div class="section-label">/optimize</div>
  <form id="optimize-form">
    <label for="prompt-input">Prompt</label>
    <textarea id="prompt-input" required></textarea>
    <label for="goal-input">Goal</label>
    <input id="goal-input" type="text" required>
    <button type="submit">Run</button>
  </form>
  <div id="optimize-result" class="readout"></div>
</div>

<div class="section">
  <div class="section-label">/compare</div>
  <form id="compare-form">
    <label for="cmp-prompt-input">Prompt</label>
    <textarea id="cmp-prompt-input" required></textarea>
    <label for="cmp-goal-input">Goal</label>
    <input id="cmp-goal-input" type="text" required>
    <label for="candidate-a-input">Candidate A</label>
    <textarea id="candidate-a-input" required></textarea>
    <label for="candidate-b-input">Candidate B</label>
    <textarea id="candidate-b-input" required></textarea>
    <button type="submit">Run</button>
  </form>
  <div id="compare-result" class="readout"></div>
</div>

<script>
  const API_BASE = "https://promptops-api.onrender.com";

  const statusDot = document.getElementById("status-dot");
  const statusText = document.getElementById("status-text");
  const slowTimer = setTimeout(() => {
    statusText.textContent = "waking service (free tier, ~30s)...";
  }, 4000);

  fetch(API_BASE + "/health")
    .then(r => {
      clearTimeout(slowTimer);
      statusDot.classList.remove("checking");
      statusDot.classList.add(r.ok ? "up" : "down");
      statusText.textContent = r.ok ? "api online" : "api unreachable";
    })
    .catch(() => {
      clearTimeout(slowTimer);
      statusDot.classList.remove("checking");
      statusDot.classList.add("down");
      statusText.textContent = "api unreachable";
    });

  function getApiKey() {
    return document.getElementById("api-key-input").value;
  }

  async function callApi(path, body) {
    let response;
    try {
      response = await fetch(API_BASE + path, {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-API-Key": getApiKey() },
        body: JSON.stringify(body)
      });
    } catch (err) {
      return { ok: false, status: "—", requestId: "n/a", data: { detail: "Could not reach the API. If it's been idle, it may be waking up, try again in a moment." } };
    }

    const requestId = response.headers.get("X-Request-ID") || "n/a";
    let data;
    try {
      data = await response.json();
    } catch (err) {
      return { ok: false, status: response.status, requestId, data: { detail: "Server responded, but not with valid JSON. It may still be waking up." } };
    }
    return { ok: response.ok, status: response.status, requestId, data };
  }

  function setPending(div) {
    div.classList.remove("ok", "error");
    div.classList.add("visible", "pending");
    div.innerHTML = `<div class="readout-head"><span>running...</span><span></span></div>`;
  }

  function renderReadout(div, outcome, rows) {
    div.classList.remove("pending", "ok", "error");
    div.classList.add("visible", outcome.ok ? "ok" : "error");
    const head = `<div class="readout-head"><span>${outcome.status} ${outcome.ok ? "OK" : "ERROR"}</span><span>${outcome.requestId}</span></div>`;
    const body = outcome.ok
      ? rows.map(([k, v]) => `<div class="row"><dt>${k}</dt><dd>${v}</dd></div>`).join("")
      : `<div class="row"><dt>detail</dt><dd>${(outcome.data && outcome.data.detail) || "Unknown error"}</dd></div>`;
    div.innerHTML = head + body;
  }

  document.getElementById("optimize-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const button = event.target.querySelector("button");
    const resultDiv = document.getElementById("optimize-result");
    button.disabled = true;
    setPending(resultDiv);

    const outcome = await callApi("/optimize", {
      prompt: document.getElementById("prompt-input").value,
      goal: document.getElementById("goal-input").value
    });
    renderReadout(resultDiv, outcome, [
      ["optimized_prompt", outcome.data.optimized_prompt],
      ["changes", outcome.data.changes]
    ]);
    button.disabled = false;
  });

  document.getElementById("compare-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const button = event.target.querySelector("button");
    const resultDiv = document.getElementById("compare-result");
    button.disabled = true;
    setPending(resultDiv);

    const outcome = await callApi("/compare", {
      prompt: document.getElementById("cmp-prompt-input").value,
      goal: document.getElementById("cmp-goal-input").value,
      candidate_a: document.getElementById("candidate-a-input").value,
      candidate_b: document.getElementById("candidate-b-input").value
    });
    renderReadout(resultDiv, outcome, [
      ["winner", "candidate " + outcome.data.winner],
      ["score_a", outcome.data.score_a],
      ["score_b", outcome.data.score_b],
      ["reasoning", outcome.data.reasoning]
    ]);
    button.disabled = false;
  });
</script>
</body>
</html>
