<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PromptOps</title>
<style>
  :root {
    --paper: #f7f7f5;
    --panel: #ffffff;
    --line: #dcdcd6;
    --ink: #1a1b1e;
    --muted: #6b6d76;
    --accent: #2451b8;
    --ok: #1f7a4d;
    --err: #b23a2e;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
    --sans: -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    max-width: 760px;
    margin: 0 auto;
    padding: 56px 24px 80px;
  }
  header { border-bottom: 1px solid var(--line); padding-bottom: 20px; margin-bottom: 32px; }
  h1 {
    font-family: var(--mono);
    font-size: 1.5rem;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin: 0 0 6px;
  }
  h1::before { content: "> "; color: var(--accent); }
  .subtitle { color: var(--muted); font-size: 0.92rem; margin: 0; }

  section { border-top: 1px solid var(--line); padding-top: 20px; margin-top: 28px; }
  .section-label {
    font-family: var(--mono);
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 14px;
  }

  label {
    display: block;
    font-family: var(--mono);
    font-size: 0.78rem;
    color: var(--muted);
    margin: 14px 0 5px;
  }
  label:first-of-type { margin-top: 0; }
  input, textarea {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 9px 11px;
    font-family: var(--sans);
    font-size: 0.92rem;
  }
  textarea { min-height: 64px; resize: vertical; font-family: var(--mono); font-size: 0.85rem; }
  input:focus, textarea:focus { outline: none; border-color: var(--accent); }

  button {
    margin-top: 16px;
    background: var(--ink);
    color: var(--paper);
    border: none;
    font-family: var(--mono);
    font-size: 0.82rem;
    letter-spacing: 0.03em;
    padding: 10px 18px;
    cursor: pointer;
  }
  button:hover { background: var(--accent); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }

  .readout {
    margin-top: 18px;
    border: 1px solid var(--line);
    display: none;
  }
  .readout.visible { display: block; }
  .readout-head {
    font-family: var(--mono);
    font-size: 0.72rem;
    padding: 8px 12px;
    border-bottom: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    color: var(--muted);
  }
  .readout.ok .readout-head { color: var(--ok); }
  .readout.error .readout-head { color: var(--err); }
  .readout-body { padding: 4px 0; }
  .row {
    display: grid;
    grid-template-columns: 130px 1fr;
    padding: 8px 12px;
    font-size: 0.88rem;
    border-bottom: 1px solid #eee;
  }
  .row:last-child { border-bottom: none; }
  .row dt { font-family: var(--mono); font-size: 0.75rem; color: var(--muted); }
  .row dd { margin: 0; }
</style>
</head>
<body>

<header>
  <h1>PromptOps</h1>
  <p class="subtitle">Prompt-optimization API — caching, retries, circuit breakers, and statistical A/B testing. Live demo.</p>
</header>

<section>
  <div class="section-label">Authentication</div>
  <label for="api-key-input">API Key</label>
  <input id="api-key-input" type="password" placeholder="Paste your API key">
</section>

<section>
  <div class="section-label">/optimize</div>
  <form id="optimize-form">
    <label for="prompt-input">Prompt</label>
    <textarea id="prompt-input" required></textarea>
    <label for="goal-input">Goal</label>
    <input id="goal-input" type="text" required>
    <button type="submit">Run</button>
  </form>
  <div id="optimize-result" class="readout"></div>
</section>

<section>
  <div class="section-label">/compare</div>
  <form id="compare-form">
    <label for="cmp-prompt-input">Prompt</label>
    <textarea id="cmp-prompt-input" required></textarea>
    <label for="cmp-goal-input">Goal</label>
    <input id="cmp-goal-input" type="text" required>
    <label for="candidate-a-input">Candidate A</label>
    <textarea id="candidate-a-input" required></textarea>
    <label for="candidate-b-input">Candidate B</label>
    <textarea id="candidate-b-input" required></textarea>
    <button type="submit">Run</button>
  </form>
  <div id="compare-result" class="readout"></div>
</section>

<script>
  const API_BASE = "https://promptops-api.onrender.com";

  function getApiKey() {
    return document.getElementById("api-key-input").value;
  }

  async function callApi(path, body) {
    const response = await fetch(API_BASE + path, {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-API-Key": getApiKey() },
      body: JSON.stringify(body)
    });
    const requestId = response.headers.get("X-Request-ID") || "n/a";
    const data = await response.json();
    return { ok: response.ok, status: response.status, requestId, data };
  }

  function renderReadout(div, outcome, rows) {
    div.classList.remove("ok", "error");
    div.classList.add("visible", outcome.ok ? "ok" : "error");
    const head = `<div class="readout-head"><span>${outcome.status} ${outcome.ok ? "OK" : "ERROR"}</span><span>${outcome.requestId}</span></div>`;
    const body = outcome.ok
      ? rows.map(([k, v]) => `<div class="row"><dt>${k}</dt><dd>${v}</dd></div>`).join("")
      : `<div class="row"><dt>detail</dt><dd>${outcome.data.detail || "Unknown error"}</dd></div>`;
    div.innerHTML = head + `<div class="readout-body">${body}</div>`;
  }

  document.getElementById("optimize-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const button = event.target.querySelector("button");
    const resultDiv = document.getElementById("optimize-result");
    button.disabled = true;

    const outcome = await callApi("/optimize", {
      prompt: document.getElementById("prompt-input").value,
      goal: document.getElementById("goal-input").value
    });

    renderReadout(resultDiv, outcome, [
      ["optimized_prompt", outcome.data.optimized_prompt],
      ["changes", outcome.data.changes]
    ]);
    button.disabled = false;
  });

  document.getElementById("compare-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const button = event.target.querySelector("button");
    const resultDiv = document.getElementById("compare-result");
    button.disabled = true;

    const outcome = await callApi("/compare", {
      prompt: document.getElementById("cmp-prompt-input").value,
      goal: document.getElementById("cmp-goal-input").value,
      candidate_a: document.getElementById("candidate-a-input").value,
      candidate_b: document.getElementById("candidate-b-input").value
    });

    renderReadout(resultDiv, outcome, [
      ["winner", "candidate " + outcome.data.winner],
      ["score_a", outcome.data.score_a],
      ["score_b", outcome.data.score_b],
      ["reasoning", outcome.data.reasoning]
    ]);
    button.disabled = false;
  });
</script>
</body>
</html>
