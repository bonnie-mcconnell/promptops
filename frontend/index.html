<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PromptOps</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2e38;
    --text: #e6e8eb;
    --muted: #8b90a0;
    --accent: #5b8cff;
    --error: #ff5b6b;
    --success: #4ade80;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 820px;
    margin: 0 auto;
    padding: 48px 24px;
    line-height: 1.5;
  }
  h1 { font-size: 1.8rem; margin-bottom: 4px; }
  .subtitle { color: var(--muted); margin-bottom: 32px; font-size: 0.95rem; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 24px;
    margin-bottom: 24px;
  }
  .card h2 { margin-top: 0; font-size: 1.1rem; }
  label {
    display: block;
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 4px;
    margin-top: 14px;
  }
  label:first-of-type { margin-top: 0; }
  input, textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: 10px 12px;
    font-family: inherit;
    font-size: 0.95rem;
  }
  textarea { min-height: 70px; resize: vertical; }
  input:focus, textarea:focus { outline: none; border-color: var(--accent); }
  button {
    margin-top: 18px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 6px;
    padding: 10px 20px;
    font-size: 0.95rem;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .result {
    margin-top: 18px;
    padding: 14px;
    border-radius: 6px;
    font-size: 0.9rem;
    white-space: pre-wrap;
    display: none;
  }
  .result.visible { display: block; }
  .result.ok { background: #14251c; border: 1px solid var(--success); }
  .result.error { background: #2a1416; border: 1px solid var(--error); color: var(--error); }
  .result dt { color: var(--muted); font-size: 0.8rem; margin-top: 8px; }
  .result dd { margin: 2px 0 0 0; }
</style>
</head>
<body>

<h1>PromptOps</h1>
<p class="subtitle">Live demo of the PromptOps API — prompt optimization and A/B comparison.</p>

<div class="card">
  <label for="api-key-input">API Key</label>
  <input id="api-key-input" type="password" placeholder="Paste your API key">
</div>

<div class="card">
  <h2>Optimize a prompt</h2>
  <form id="optimize-form">
    <label for="prompt-input">Prompt</label>
    <textarea id="prompt-input" required></textarea>

    <label for="goal-input">Goal</label>
    <input id="goal-input" type="text" required>

    <button type="submit">Optimize</button>
  </form>
  <div id="optimize-result" class="result"></div>
</div>

<div class="card">
  <h2>Compare two candidates</h2>
  <form id="compare-form">
    <label for="cmp-prompt-input">Prompt</label>
    <textarea id="cmp-prompt-input" required></textarea>

    <label for="cmp-goal-input">Goal</label>
    <input id="cmp-goal-input" type="text" required>

    <label for="candidate-a-input">Candidate A</label>
    <textarea id="candidate-a-input" required></textarea>

    <label for="candidate-b-input">Candidate B</label>
    <textarea id="candidate-b-input" required></textarea>

    <button type="submit">Compare</button>
  </form>
  <div id="compare-result" class="result"></div>
</div>

<script>
  const API_BASE = "https://promptops-api.onrender.com";

  function getApiKey() {
    return document.getElementById("api-key-input").value;
  }

  async function callApi(path, body) {
    const response = await fetch(API_BASE + path, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-API-Key": getApiKey()
      },
      body: JSON.stringify(body)
    });

    const data = await response.json();
    return { ok: response.ok, status: response.status, data: data };
  }

  function showResult(div, outcome, render) {
    div.classList.remove("ok", "error");
    div.classList.add("visible", outcome.ok ? "ok" : "error");
    div.innerHTML = outcome.ok
      ? render(outcome.data)
      : `<strong>Error ${outcome.status}:</strong> ${outcome.data.detail || "Unknown error"}`;
  }

  document.getElementById("optimize-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const button = event.target.querySelector("button");
    const resultDiv = document.getElementById("optimize-result");

    button.disabled = true;
    resultDiv.classList.remove("ok", "error");
    resultDiv.classList.add("visible");
    resultDiv.textContent = "Optimizing...";

    const outcome = await callApi("/optimize", {
      prompt: document.getElementById("prompt-input").value,
      goal: document.getElementById("goal-input").value
    });

    showResult(resultDiv, outcome, (data) => `
      <dl>
        <dt>Optimized prompt</dt><dd>${data.optimized_prompt}</dd>
        <dt>Changes</dt><dd>${data.changes}</dd>
      </dl>
    `);
    button.disabled = false;
  });

  document.getElementById("compare-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const button = event.target.querySelector("button");
    const resultDiv = document.getElementById("compare-result");

    button.disabled = true;
    resultDiv.classList.remove("ok", "error");
    resultDiv.classList.add("visible");
    resultDiv.textContent = "Comparing...";

    const outcome = await callApi("/compare", {
      prompt: document.getElementById("cmp-prompt-input").value,
      goal: document.getElementById("cmp-goal-input").value,
      candidate_a: document.getElementById("candidate-a-input").value,
      candidate_b: document.getElementById("candidate-b-input").value
    });

    showResult(resultDiv, outcome, (data) => `
      <dl>
        <dt>Winner</dt><dd>Candidate ${data.winner.toUpperCase()}</dd>
        <dt>Score A</dt><dd>${data.score_a}</dd>
        <dt>Score B</dt><dd>${data.score_b}</dd>
        <dt>Reasoning</dt><dd>${data.reasoning}</dd>
      </dl>
    `);
    button.disabled = false;
  });
</script>
</body>
</html>
